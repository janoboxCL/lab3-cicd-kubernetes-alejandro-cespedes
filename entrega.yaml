apiVersion: v1
kind: Namespace
metadata:
  name: ns-alejandro-cespedes

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-alejandro-cespedes
  namespace: ns-alejandro-cespedes
data:
  AMBIENTE: "kubernetes"

---
apiVersion: v1
kind: Secret
metadata:
  name: secret-alejandro-cespedes
  namespace: ns-alejandro-cespedes
type: Opaque
stringData:
  API_KEY: "lab3-api-key-alejandro"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-alejandro-cespedes
  namespace: ns-alejandro-cespedes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-alejandro-cespedes
  template:
    metadata:
      labels:
        app: app-alejandro-cespedes
    spec:
      containers:
        - name: app-alejandro-cespedes
          image: janobox/tarea-final:alejandro-cespedes
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: config-alejandro-cespedes
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-alejandro-cespedes
                  key: API_KEY

---
apiVersion: v1
kind: Service
metadata:
  name: svc-alejandro-cespedes
  namespace: ns-alejandro-cespedes
spec:
  selector:
    app: app-alejandro-cespedes
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
